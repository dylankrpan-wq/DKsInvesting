[theme]
base = "dark"
primaryColor = "#00d4aa"
backgroundColor = "#0b0f1a"
secondaryBackgroundColor = "#151b2c"
textColor = "#e8ecf4"
font = "sans serif"

[browser]
gatherUsageStats = false

# headless=false so LOCAL `streamlit run` auto-opens your browser. The hosted
# Railway deploy sets `--server.headless true` on its start command (railway.json),
# which overrides this — so production stays headless regardless.
[server]
headless = false
runOnSave = true
