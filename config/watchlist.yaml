alerts:
  price_move_pct: 5.0          # flag daily moves >= 5%
  volume_spike_x: 3.0          # flag volume >= 3x 20d avg
  earnings_window_days: 7      # flag earnings within next N days
  sentiment_threshold: 0.6     # |compound score| >= this is "strong"
  sentiment_min_articles: 3    # require N articles in window for ticker-level sentiment surge
  macro_window_days: 3         # alert importance>=2 macro events within N days
  # 🎯 High-conviction setups (CONVICTION_LONG / CONVICTION_SHORT) — fires when
  # the radar's convergence math crosses these bars. Lower = more alerts.
  conviction_long_min: 35.0    # bullish convergence (score+lean+tone+momentum+catalyst)
  conviction_short_min: 24.0   # bearish convergence (lean+tone+down momentum+earnings risk)
  conviction_scan_heat_min: 45.0  # off-watchlist market-scan heat to qualify

sentiment:
  engine: vader   # options: vader (fast, free) | finbert (heavier, financial-tuned, opt-in)

opportunity:
  rank_jump_threshold: 3       # alert when ticker climbs >= N ranks
  rank_jump_min_score: 35.0    # ...and current score >= this (filter noise)
  score_surge_points: 10.0     # alert when score gains >= N points between snapshots
  new_top_k: 5                 # alert when ticker enters top K from outside

notifications:
  discord_webhook_env: DISCORD_WEBHOOK_URL  # set in secrets.env to enable Discord alerts

# Footer signature shown at the bottom of the dashboard. Change to your own.
branding:
  signature: "DK Investing™"

# 🚨 Crypto-derivatives spike alerts — a sub-minute loop over ALL Blofin perp
# pairs (no API key needed) that texts you instantly when a pair moves sharply
# in a short window (the BEAT-USDT / TRUMP-USDT style fast pump). Separate from
# the 24h CRYPTO_MOVE alert. Requires the scheduler running.
crypto_spike:
  enabled: true
  interval_seconds: 90       # how often to snapshot all perps (floor 30s)
  inst_type: SWAP            # Blofin perpetual swaps
  windows:                   # alert if |move| >= pct within minutes
    - {minutes: 3, pct: 6}
    - {minutes: 10, pct: 12}
  retention_minutes: 15      # rolling tick history kept per pair
  min_quote_vol_usd: 100000  # skip illiquid pairs (24h USD turnover floor)
  cooldown_minutes: 30       # don't re-alert the same pair within this
  direction: both            # up | down | both (pumps and dumps)

# Perp setup math. stop_atr_mult places the stop a volatility buffer (this ×
# 1H ATR) beyond the structural level instead of a flat 0.5%, so normal wicks
# past support/resistance don't stop you out before the move works. The call-out
# scorecard A/Bs this over time (new setups use the new value; resolved ones
# freeze). 0 = old flat-0.5% behavior; ~0.5–1.0 = progressively wider.
perp:
  stop_atr_mult: 0.5

# 📊 Perp setup tracker — follows each pushed SETUP_SCAN setup against its
# entry/stop/TP1/2/3 and pings the phone the moment it touches a TP rung or its
# stop (laddering TP1→TP2→TP3, closing on stop or TP3), plus an hourly "how the
# open setups are doing" recap. Runs in the fast spike loop + hourly job.
perp_tracker:
  enabled: true
  hourly_recap: true         # consolidated open-setups recap each hour
  max_age_hours: 48          # auto-expire a setup that never hits a TP or its stop
  recap_max: 12              # cap the hourly recap to this many open setups

# 📋 Stock thesis pushes — event-triggered. When a watchlist or discovered name
# forms a setup (bullish/bearish convergence, or a high-heat market-scan mover),
# a concise forward-looking thesis note (chart + momentum + catalyst) is texted
# to Telegram. Per-name cooldown + per-cycle cap. Runs in the poll cycle, so it
# needs the scheduler running and ANTHROPIC_API_KEY for the written note.
thesis_push:
  enabled: true
  max_per_cycle: 2           # most thesis notes to push per poll cycle
  cooldown_hours: 12         # don't re-push the same stock within this window
  include_discovered: true   # also cover off-watchlist market-scan movers
  scan_heat_min: 40          # min market-scan heat for a discovered name to qualify
  model: claude-opus-4-8     # cheaper models work too (e.g. claude-haiku-4-5)

# 🎯 Scheduled perp setup scan — hourly, ranks all Blofin perps for "leverage in
# my favor" setups (tight stop vs target) and texts the top 1-2 standouts. Higher
# quality bar than the manual dashboard scan. Requires the scheduler running.
setup_scan:
  enabled: true
  cron_minute: 30            # runs at HH:30, offset from the hourly pulse at HH:00
  # --- PUSH bar (what actually texts your phone) ---
  top_n: 2                   # most to push per run
  min_rr: 4.0                # only push setups with R:R >= this (manual scan uses 2.5)
  max_risk_pct: 3.0          # ...and stop within this % of entry (tight = leverage-friendly)
  cooldown_hours: 6          # don't re-push the same pair within this window
  side: both                 # both | long | short
  # --- TRACK bar (silent SETUP_TRACK rows the scorecard scores, NOT pushed) ---
  # Builds a 10-20/day sample to learn what wins. Wider net, lower bar; the
  # phone still only gets the PUSH subset above. Tune track_top_n × scans/day.
  track_top_n: 6             # silent setups to record per scan (≈10-20/day w/ cooldown)
  track_universe: 20         # rank up to this many that clear the track bar
  track_deep: 40             # deep-analyze this many of the most volatile perps
  track_min_rr: 2.5          # track setups with R:R >= this (vs push 4.0)
  track_max_risk_pct: 5.0    # ...and risk <= this (vs push 3.0)
  track_cooldown_hours: 3    # don't re-track the same pair within this window

# 💡 Equity idea engine — multi-horizon (short-term/swing/long-term) LONG ideas
# across a broad liquid cross-sector universe, each with logic + a Claude thesis +
# $100-floor sizing. Pushes the best few (with theses); silently tracks the rest
# (EQUITY_IDEA_TRACK) for the scorecard. Keyless technical + relative strength.
# Trading days only; runs at the scan_hours_utc (comma-separated UTC hours).
equity_ideas:
  enabled: true
  scan_hours_utc: "14,18"    # UTC cron hours; ≈10:15/14:15 ET in summer (EDT), 09:15/13:15 ET in winter (EST)
  max_deep: 30               # deep-analyze this many shortlisted names per scan
  min_conviction: 3          # only push/track ideas with >= this many supporting reasons
  min_rr: 1.0                # ...and a nearest-target R:R >= this (drops sub-1:1 short-term ideas)
  push_top_n: 3              # best ideas pushed to the phone (each with a thesis)
  track_top_n: 12            # also silently track this many more (scorecard sample)
  cooldown_hours: 24         # don't re-pitch/re-track the same symbol within this
  model: claude-opus-4-8     # thesis model (cheaper options work, e.g. claude-haiku-4-5)
  send_to_phone: true

# 🌅 Pre-market US-equity gap scan — runs every scan_minutes during the pre-market
# window (4:00-9:45 ET, trading days only) and texts gappers. Watchlist names use
# a lower threshold than off-list market movers. Keyless (yfinance prepost bars).
# Requires the scheduler running.
premarket:
  enabled: true
  scan_minutes: 15           # how often to scan during the pre-market window
  watchlist_min_pct: 2.0     # |gap %| to alert a watchlist name
  movers_min_pct: 4.0        # |gap %| to alert an off-list big mover
  include_movers: true       # also scan the day's market-wide movers
  max_movers: 30             # cap the off-list universe per scan
  max_alerts: 6              # most gappers to push per scan
  cooldown_minutes: 90       # don't re-alert the same symbol within this

# 🌙 Overnight "while you slept" digest — a template (no Claude) recap texted on
# trading-day mornings: US index futures + overseas indices + overnight breaking
# news. Poller-driven + ET-anchored (DST-correct) + idempotent, so it sends once.
overnight:
  enabled: true
  hour_et: 6                 # fires at/after 06:30 ET on trading-day mornings
  minute: 30
  window_hours: 3            # self-heal: still sends if the 06:30 poll was missed
  headline_hours: 14         # overnight news lookback window
  max_headlines: 8

# 🌅 Pre-open morning brief — Claude-written AM counterpart to the desk brief,
# generated once per trading day in the pre-open window: overnight futures/overseas
# + pre-market gappers + today's earnings/macro + setups into the open. Poller-
# driven + ET-anchored (DST-correct) + idempotent. Needs ANTHROPIC_API_KEY.
morning_brief:
  enabled: true
  hour_et: 8                 # pre-open window starts 08:30 ET (before the 09:30 open)
  minute: 30
  window_hours: 2.5          # generate if within this many hours of hour:minute (self-heals)
  model: claude-opus-4-8
  send_to_phone: true

# 📊 Hourly pulse — a consolidated activity summary texted at the top of each
# hour, 24/7, but ONLY when the prior hour had notable activity (conviction
# setups, movers, breaking news, crypto moves, rank changes). Quiet hours stay
# silent. Requires the scheduler to be running (start_scheduler.bat or the
# dashboard's in-process scheduler). Separate from instant alerts and the
# daily brief.
hourly:
  enabled: true
  window_minutes: 60         # how far back each pulse looks
  max_per_kind: 5            # cap items shown per category in the text
  min_notable: 3             # an hour with only low-signal tech alerts needs >= this many to send
  # The pulse skips alerts already texted instantly by the per-cycle digest
  # (the sms.live_kinds below), so you're never notified twice for one event —
  # it's a complementary roundup of everything else that moved (price/volume/
  # crypto moves, score shifts, tech signals).

# Daily desk brief — Claude-written end-of-day synthesis shown in the 📡 Now tab.
# Requires ANTHROPIC_API_KEY in config/secrets.env (https://platform.claude.com).
# Grounded in local DB data only; costs roughly $0.10-0.20 per market day on Opus.
brief:
  enabled: true
  hour_utc: 21               # generate on the first poll at/after this UTC hour (21:00 UTC ≈ just after US close)
  model: claude-opus-4-8     # cheaper options work too (e.g. claude-haiku-4-5 ≈ $0.02/day)
  send_to_phone: true        # also push the brief through the Telegram/SMS channel below

# SMS phone alerts — which alert kinds count as "live events" worth a text,
# and how many to include per digest text. Credentials live in secrets.env.
sms:
  max_items_per_text: 5
  live_kinds:
    - CONVICTION_LONG
    - CONVICTION_SHORT
    - CRYPTO_SPIKE
    - SETUP_SCAN
    - PREMARKET_GAP
    - HIGH_IMPACT_NEWS
    - NEWS_VELOCITY
    - PERSON_ACTIVITY
    - EVENT_NEAR
    - MACRO_NEAR
    - EARNINGS_NEAR
    - RANK_JUMP
    - NEW_TOP
