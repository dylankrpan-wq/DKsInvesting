# ~25-min sector digest settings
sector_digest:
  interval_minutes: 25
  market_hours_only: true      # only push during US pre-market + RTH on trading days
  move_threshold_pct: 4.0      # flag names moving >= this today
  max_setups: 5                # top forming setups to include (with backtest)
  max_deals: 4                 # top deal/M&A headlines
  max_news: 5                  # top breaking headlines
  backtest_forward_days: 10
  backtest_target_pct: 6.0
