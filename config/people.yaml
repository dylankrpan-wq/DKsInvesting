# DK Investing — market-moving people watchlist.
# When any of these names appears in a news headline + sentiment is strong
# (positive or negative) OR a breaking keyword hits, fires a PERSON_ACTIVITY alert.
#
# Edit freely. The aliases list catches all the ways outlets refer to them.
# `affects`: tickers/themes most likely to move on this person's words.
# `weight`: 1 (medium pull) | 2 (heavy pull) | 3 (market-moving).

people:
