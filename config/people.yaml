    name: Donald Trump
    role: US President
    aliases: ["Donald Trump", "Trump", "President Trump", "POTUS", "the President"]
    affects: [SPY, QQQ, DXY, TSLA, BTC, ETH, "tariffs", "trade"]
    weight: 3
    keywords: [tariff, tariffs, executive order, sanctions, trade deal,
               "national security", "america first", "fed independence",
               "powell", impeach, indictment, criminal, "rate cut",
               truth social, posts on, deal with, threatens]

