[project]
name = "dk-investing"
version = "0.1.0"
description = "Personal stock + crypto sentiment & alert system"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.50",
    "feedparser>=6.0.11",
    "requests>=2.32",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "streamlit>=1.39",
    "plotly>=5.24",
    "apscheduler>=3.10",
    "vadersentiment>=3.3.2",
    "tradingview-ta>=3.3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false
